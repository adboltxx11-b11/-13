main{position:relative;z-index:1;max-width:640px;margin:0 auto;padding:20px 16px 40px}
h1{font-family:Amiri,serif;font-size:2.4rem;text-align:center;margin:8px 0 18px;color:var(--gold)}
.bar{display:flex;justify-content:space-between;gap:6px;margin-bottom:22px}
.dot{flex:1;aspect-ratio:1;max-width:46px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;font-weight:700;font-size:.95rem;transition:.3s;background:rgba(0,0,0,.25)}
.dot.now{border-color:var(--gold);box-shadow:0 0 0 3px rgba(232,194,122,.25)}
.dot.ok{background:var(--ok);border-color:var(--ok);color:#fff}
.card{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:22px 18px;backdrop-filter:blur(6px)}
.q{font-size:1.25rem;line-height:1.7;margin:0 0 16px;font-weight:700}
.opt{display:flex;align-items:center;justify-content:space-between;width:100%;text-align:right;font:inherit;font-size:1.05rem;color:var(--ink);background:rgba(255,255,255,.07);border:1.5px solid var(--line);border-radius:12px;padding:13px 16px;margin-bottom:10px;cursor:pointer;transition:.2s}
.opt:hover:not(:disabled){background:rgba(232,194,122,.18)}
.opt:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.opt:disabled{cursor:default}
.opt.right{background:rgba(55,194,107,.28);border-color:var(--ok)}
.opt .m{font-size:1.4rem;color:var(--ok);font-weight:700}
.res{text-align:center}
.res .n{font-family:Amiri,serif;font-size:3.4rem;color:var(--gold);margin:4px 0}
.btn{font:inherit;font-weight:700;background:var(--gold);color:#2a1a0a;border:0;border-radius:12px;padding:12px 28px;cursor:pointer;margin-top:10px}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<main>
<h1>المسابقة</h1>
<div class="bar" id="bar"></div>
<div class="card" id="card"></div>
</main>
<script>
const Q=[
{q:"من هو كاتب رسالة تيطس؟",o:["بطرس","بولس","يوحنا"],a:1},
{q:"إلى مَن كتب بولس هذه الرسالة؟",o:["تيطس","تيموثاوس","لوقا"],a:0},
{q:"كيف وصف بولس نفسه في بداية الرسالة؟",o:["شيخ المدينة","عبد الله ورسول يسوع المسيح","معلم الكنيسة"],a:1},
{q:"الله الذي وعد بالحياة الأبدية هو الله المنزَّه عن:",o:["الحزن","الكذب","النوم"],a:1},
{q:"في أي جزيرة ترك بولس تيطس؟",o:["قبرص","ملقة","كريت"],a:2},
{q:"ماذا طلب بولس من تيطس أن يقيم في كل مدينة؟",o:["شيوخًا","تجّارًا","جنودًا"],a:0},
{q:"كيف نادى بولس تيطس؟",o:["الخادم الصغير","الضيف الغريب","الابن الصريح"],a:2},
{q:"ما هي تحية بولس لتيطس؟",o:["نعمة ورحمة وسلام","محبة وفرح وسلام","بركة ونعمة وخلاص"],a:0},
{q:"من صفات الأسقف:",o:["غضوب","معجَب بنفسه","بلا لوم"],a:2},
{q:"الأسقف لا يكون:",o:["بلا لوم","مدمنًا للخمر","وكيلًا لله"],a:1}
];
let i=0,score=0,locked=false,done=[];
const bar=document.getElementById('bar'),card=document.getElementById('card');
function drawBar(){bar.innerHTML=Q.map((_,k)=>'<div class="dot'+(done[k]?' ok':'')+(k===i&&!done[k]?' now':'')+'">'+(done[k]?'✓':(k+1))+'</div>').join('');}
function show(){
  if(i>=Q.length){return end();}
  locked=false;drawBar();
  const q=Q[i];
  card.innerHTML='<p class="q">'+q.q+'</p>';
  q.o.forEach((t,k)=>{
    const b=document.createElement('button');b.className='opt';b.type='button';b.textContent=t;
    b.onclick=()=>pick(k,b);card.appendChild(b);
  });
}
function pick(k,b){
  if(locked)return;locked=true;
  if(k===Q[i].a){
    score++;done[i]=true;b.classList.add('right');
    b.innerHTML='<span>'+b.textContent+'</span><span class="m">✓</span>';
    card.querySelectorAll('.opt').forEach(x=>x.disabled=true);
    drawBar();
    setTimeout(()=>{i++;show();},900);
  }else{i++;show();}
}
function end(){
  i=Q.length;drawBar();
  const msg=score===10?'ممتاز! أجبت على كل الأسئلة بشكل صحيح':score>=7?'أحسنت! نتيجة جميلة':'حاول مرة أخرى، وستنجح بإذن الله';
  card.innerHTML='<div class="res"><p class="q">انتهت المسابقة</p><div class="n">'+score+' / '+Q.length+'</div><p>'+msg+'</p><button class="btn" id="re">ابدأ من جديد</button></div>';
  document.getElementById('re').onclick=()=>{i=0;score=0;done=[];show();};
}
show();
</script>
</body>
</html>
